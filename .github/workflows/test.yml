name: Test

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test lib - no default features
        run: nix develop .#ci -c cargo test --quiet --no-default-features

      - name: Test lib - std features
        run: nix develop .#ci -c cargo test --quiet --features=std

      - name: Test lib - merge features
        run: |
          nix develop .#ci -c cargo test --quiet --features=merge --no-default-features
          nix develop .#ci -c cargo test --quiet --features=merge

      - name: Test lib - default features
        run: nix develop .#ci -c cargo test --quiet

      - name: Test patch examples - no default features
        run: |
          MANIFEST=examples/patch-examples/Cargo.toml
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example instance
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example diff
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example json
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example rename-patch-struct
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example patch-attr
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example time
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example clap
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --features=nesting --example nesting
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --features=option --example option
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example log
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --example apply-by
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --no-default-features --features=box --example box

      - name: Test patch examples - std features
        run: |
          MANIFEST=examples/patch-examples/Cargo.toml
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std --example instance
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std --example diff
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std --example json
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std --example rename-patch-struct
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std --example patch-attr
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std --example option
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std --example box
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=std,nesting --example nesting

      - name: Test patch examples - merge features
        run: |
          MANIFEST=examples/patch-examples/Cargo.toml
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=option,merge --example option
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=merge --example op
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=merge,nesting --example nesting

      - name: Test patch examples - option features
        run: |
          MANIFEST=examples/patch-examples/Cargo.toml
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=none_as_default --example option
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=none_as_default,nesting --example nesting
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=keep_none --example option
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=keep_none,nesting --example nesting

      - name: Test patch examples - default features
        run: |
          MANIFEST=examples/patch-examples/Cargo.toml
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --example status
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --example op
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --example clap
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=nesting --example nesting
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=nesting --example clap
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --example log
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --example apply-by
          nix develop .#ci -c cargo run --quiet --manifest-path $MANIFEST --features=box --example box

      - name: Test filler examples - no default features
        run: nix develop .#ci -c check-filler no-default

      - name: Test filler examples - default features
        run: nix develop .#ci -c check-filler default

      - name: Test in no std
        run: nix develop .#no-std -c check-no-std

      - name: Test complex examples
        run: nix develop .#ci -c check-complex
